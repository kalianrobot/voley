function formatDateKey(d) {

  return `${y}-${m}-${day}`;

  return new Date(y, m - 1, d);

  const d = parseDateKey(key);

const MESES_CORTOS = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

// fechaHora: 'YYYY-MM-DDTHH:mm' (valor de un <input type="datetime-local">)
function formatFechaHoraCorta(fechaHora) {
  if (!fechaHora) return '';
  const [fecha, hora] = fechaHora.split('T');
  const [y, m, d] = fecha.split('-').map(Number);
  return `${d} ${MESES_CORTOS[m - 1]} ${hora || ''}`.trim();
}

function formatRangoFechasTorneo(torneo) {

function estadoTorneo(torneo) {
  const ahora = Date.now();
  const inicio = torneo.fechaInicio ? new Date(torneo.fechaInicio).getTime() : null;
  const fin = torneo.fechaFin ? new Date(torneo.fechaFin).getTime() : null;
  if (inicio != null && ahora < inicio) return 'Próximo';
  if (fin != null && ahora > fin) return 'Finalizado';
  return 'En curso';
}

function faseTorneo(torneo) {
  if (!torneo.grupos) return 'Sin sortear';
  if (!torneo.eliminatoria) return 'Fase de grupos';
  const final = torneo.eliminatoria.rondas[torneo.eliminatoria.rondas.length - 1];
  const acabado = final && final.partidos.every(p => p.ganadorId);
  return acabado ? 'Finalizado' : 'Eliminatorias';
}

    return fecha >= t.fechaInicio.slice(0, 10) && fecha <= t.fechaFin.slice(0, 10);

function capitalizar(texto) {
  return texto ? texto.charAt(0).toUpperCase() + texto.slice(1) : '';
}

// Torneos que se juegan simultáneamente con éste (incluido él), en orden estable.
// Un torneo sin bloqueId es un bloque de uno solo.
function torneosDelBloque(torneo, torneos) {
  const todos = torneos || Object.values(state.torneos || {});
  if (!torneo.bloqueId) return [torneo];
  return todos
    .filter(t => t.bloqueId === torneo.bloqueId)
    .sort((a, b) => (a.ordenBloque || 0) - (b.ordenBloque || 0));
}

// En un bloque los torneos comparten nombre, así que hay que distinguirlos por categoría.

async function runUpdate(updater, opts = {}) {
  saving = true;
  try {
    const nuevo = await db.runTransaction(async (tx) => {
      const snap = await tx.get(DOC_REF);
      let remote = emptyState();
      if (snap.exists) {
        try {
          remote = sanitizeState(JSON.parse(snap.data().data));
        } catch (e) {
          remote = emptyState();
        }
      }
      const resultado = typeof updater === 'function' ? updater(remote) : updater;
      tx.set(DOC_REF, { data: JSON.stringify(resultado) });
      return resultado;
    });
    state = nuevo;
    if (opts.render !== false) render();
    return nuevo;
  } catch (e) {
    console.error('Error guardando en Firestore', e);
  } finally {
    saving = false;
  }
}

function esc(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}

function update(updater, opts) {
  return runUpdate(updater, opts);
}

function copyAndOpenWhatsapp() {
  if (!notifyMessage) return;
  const texto = notifyMessage;
  const fallbackCopy = () => {
    const textarea = document.createElement('textarea');
    textarea.value = texto;
    textarea.style.position = 'fixed';
    textarea.style.opacity = '0';
    document.body.appendChild(textarea);
    textarea.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(textarea);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(texto).catch(fallbackCopy);
  } else {
    fallbackCopy();
  }
  window.open('https://wa.me/?text=' + encodeURIComponent(texto), '_blank');
  notifyMessage = null;
  render();
}

/* ---------- Torneos: cálculo y sorteo ---------- */

function esPotenciaDeDos(n) {
  return Number.isInteger(n) && n > 0 && (n & (n - 1)) === 0;
}

// Sugerencia simple basada en el número de equipos, solo un punto de partida editable.
function sugerirNumGrupos(numEquipos) {
  if (numEquipos <= 4) return 1;
  if (numEquipos <= 8) return 2;
  if (numEquipos <= 16) return 4;
  return 8;
}

function sugerirClasificados() {
  return 2;
}

// Potencias de dos desde 1 hasta max (inclusive). Se usan para limitar los desplegables
// de "Nº de grupos" y "Clasifican por grupo" a combinaciones que siempre son válidas
// (grupos × clasificados es automáticamente potencia de 2 si ambos lo son).
function opcionesPotenciasDeDosHasta(max) {
  const opciones = [];
  for (let p = 1; p <= max; p *= 2) opciones.push(p);
  return opciones.length ? opciones : [1];
}

function opcionesNumGrupos(numEquipos) {
  return opcionesPotenciasDeDosHasta(Math.max(1, numEquipos));
}

function opcionesClasificados(numEquipos, numGrupos) {
  const maxPorGrupo = Math.max(1, Math.floor(numEquipos / Math.max(1, numGrupos)));
  return opcionesPotenciasDeDosHasta(maxPorGrupo);
}

function sugerirNumPartidos(numEquipos, numGrupos) {
  const tam = Math.max(1, Math.round(numEquipos / Math.max(1, numGrupos)));
  return Math.round(tam * (tam - 1) / 2);
}

// Devuelve un mensaje de error (o null) para la pausa de comer: ambos campos vacíos
// (sin pausa) es válido; si se rellena uno, el otro también es obligatorio.
function validarComida(comidaInicio, comidaFin) {
  if (!comidaInicio && !comidaFin) return null;
  if (!comidaInicio || !comidaFin) {
    return 'Si indicas la pausa para comer, hace falta tanto la hora de inicio como la de fin';
  }
  if (comidaFin <= comidaInicio) {
    return 'La hora de fin de la comida debe ser posterior a la de inicio';
  }
  return null;
}

function validarCompeticion(comp) {
  const producto = comp.numGrupos * comp.clasificadosPorGrupo;
  if (!esPotenciaDeDos(producto)) {
    return `grupos × clasificados debe ser una potencia de 2 (2, 4, 8, 16...). Actualmente: ${comp.numGrupos} × ${comp.clasificadosPorGrupo} = ${producto}.`;
  }
  if (comp.numGrupos > 0 && comp.clasificadosPorGrupo > Math.floor(comp.numEquipos / comp.numGrupos)) {
    return `No puede haber ${comp.clasificadosPorGrupo} clasificados por grupo si algún grupo tiene menos equipos que eso.`;
  }
  return null;
}

// Valida el formato de puntuación compartido por fase de grupos y eliminatorias:
// el tope debe estar por encima de los puntos por set (si no, el margen de 2 nunca
// llegaría a decidir el set) y el número de sets debe ser impar para que siempre
// haya un ganador claro.
function validarFormatoPartido(d) {
  if (!(d.puntosMaximo > d.puntosPorSet)) {
    return `El tope de puntos (${d.puntosMaximo}) debe ser mayor que los puntos por set (${d.puntosPorSet}).`;
  }
  if (d.numSets % 2 === 0) {
    return `El número de sets debe ser impar (1, 3, 5...) para que siempre haya un ganador.`;
  }
  return null;
}

function validarTorneoModal(data) {
  const activas = competicionesActivas(data);
  const dos = activas.length > 1;

  if (dos && activas[0].categoria === activas[1].categoria) {
    return { valid: false, error: '⚠️ Los dos torneos simultáneos deben ser de categorías distintas.' };
  }

  for (let i = 0; i < activas.length; i++) {
    const error = validarCompeticion(activas[i]);
    if (error) {
      return { valid: false, error: dos ? `⚠️ Torneo ${i + 1}: ${error}` : `⚠️ ${error}` };
    }
  }

  const errorFormato = validarFormatoPartido(data);
  if (errorFormato) {
    return { valid: false, error: `⚠️ ${errorFormato}` };
  }
  return { valid: true, error: null };
}

// Método del "círculo": reparte los equipos de un grupo en rondas donde cada equipo
// juega como mucho una vez por ronda (si el grupo es impar se añade un hueco/bye).
// Esto es lo que luego permite repartir partidos de distintos grupos en la misma
// franja horaria sin que ningún equipo tenga que jugar dos partidos a la vez.
function generarRondasRoundRobin(equiposOriginales) {
  const equipos = [...equiposOriginales];
  if (equipos.length < 2) return [];
  if (equipos.length % 2 !== 0) equipos.push(null); // bye
  const n = equipos.length;
  const numRondas = n - 1;
  const rondas = [];
  let arreglo = equipos.slice();
  for (let r = 0; r < numRondas; r++) {
    const ronda = [];
    for (let i = 0; i < n / 2; i++) {
      const a = arreglo[i];
      const b = arreglo[n - 1 - i];
      if (a && b) ronda.push([a, b]);
    }
    rondas.push(ronda);
    const fijo = arreglo[0];
    const resto = arreglo.slice(1);
    resto.push(resto.shift());
    arreglo = [fijo, ...resto];
  }
  return rondas;
}

// El calendario de grupos siempre es todos-contra-todos; numPartidosGrupo es solo orientativo,
// no hay una forma justa de decidir qué partidos recortar si no coincide.
function generarPartidosGrupo(grupos) {
  const partidos = [];
  (grupos || []).forEach(grupo => {
    const rondas = generarRondasRoundRobin(grupo.equipos);
    rondas.forEach((ronda, rIdx) => {
      ronda.forEach(([equipoA, equipoB]) => {
        partidos.push({
          id: uid(),
          grupoId: grupo.id,
          ronda: rIdx,
          equipoA,
          equipoB,
          puntosA: null,
          puntosB: null,
          campo: null,
          horaInicio: null
        });
      });
    });
  });
  return partidos;
}

function toDateTimeLocalString(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  const h = String(date.getHours()).padStart(2, '0');
  const mi = String(date.getMinutes()).padStart(2, '0');
  return `${y}-${m}-${d}T${h}:${mi}`;
}

// Trocea los partidos de un torneo en "tandas": lo que cabe en una franja horaria.
// Todos los partidos de una misma ronda son seguros en paralelo (ningún equipo se
// repite dentro de una ronda, ver generarRondasRoundRobin), pero partidos de rondas
// distintas NO pueden compartir franja, así que se trocea ronda a ronda.
function tandasDePartidos(partidos, numCampos) {
  const maxRonda = partidos.reduce((m, p) => Math.max(m, p.ronda || 0), 0);
  const tandas = [];
  for (let r = 0; r <= maxRonda; r++) {
    const partidosRonda = partidos
      .filter(p => (p.ronda || 0) === r)
      .sort((a, b) => String(a.grupoId).localeCompare(String(b.grupoId)));
    for (let i = 0; i < partidosRonda.length; i += numCampos) {
      tandas.push(partidosRonda.slice(i, i + numCampos));
    }
  }
  return tandas;
}

// Si `momentoMs` cae dentro de la pausa para comer de ESE día ('HH:mm'-'HH:mm',
// se repite cada día que dure el torneo), lo adelanta hasta el final de la pausa.
// Sin comidaInicio/comidaFin configurados es un no-op.
function saltarComidaSiHaceFalta(momentoMs, comidaInicio, comidaFin) {
  if (!comidaInicio || !comidaFin) return momentoMs;
  const d = new Date(momentoMs);
  const [hIni, mIni] = comidaInicio.split(':').map(Number);
  const [hFin, mFin] = comidaFin.split(':').map(Number);
  const inicioMs = new Date(d.getFullYear(), d.getMonth(), d.getDate(), hIni, mIni).getTime();
  const finMs = new Date(d.getFullYear(), d.getMonth(), d.getDate(), hFin, mFin).getTime();
  return (momentoMs >= inicioMs && momentoMs < finMs) ? finMs : momentoMs;
}

// Asigna hora y campo a los partidos de fase de grupos de todo un bloque de torneos
// simultáneos. Las tandas de cada torneo se van intercalando franja a franja, de modo
// que mientras un torneo ocupa los campos el otro descansa (y quien juega los dos
// nunca tiene dos partidos a la vez). Con un solo torneo son tandas consecutivas.
// Solo toca campo/horaInicio: no regenera partidos, así que reprogramar no pierde resultados.
function programarPartidosBloque(torneos) {
  const config = torneos[0] || {};
  const numCampos = Math.max(1, config.numCampos || 1);
  const duracionMs = Math.max(1, config.duracionPartidoMin || 20) * 60000;
  const inicio = config.fechaInicio ? new Date(config.fechaInicio).getTime() : Date.now();

  const porTorneo = {};
  const tandasPorTorneo = torneos.map(t => {
    const partidos = (t.partidosGrupo || []).map(p => ({ ...p }));
    porTorneo[t.id] = partidos;
    return tandasDePartidos(partidos, numCampos);
  });

  const siguiente = tandasPorTorneo.map(() => 0);
  let cursor = inicio;
  let quedan = true;
  while (quedan) {
    quedan = false;
    for (let k = 0; k < tandasPorTorneo.length; k++) {
      if (siguiente[k] >= tandasPorTorneo[k].length) continue;
      cursor = saltarComidaSiHaceFalta(cursor, config.comidaInicio, config.comidaFin);
      const tanda = tandasPorTorneo[k][siguiente[k]];
      siguiente[k] += 1;
      const hora = toDateTimeLocalString(new Date(cursor));
      tanda.forEach((partido, i) => {
        partido.campo = i + 1;
        partido.horaInicio = hora;
      });
      cursor += duracionMs;
      if (siguiente[k] < tandasPorTorneo[k].length) quedan = true;
    }
  }

  cursor = saltarComidaSiHaceFalta(cursor, config.comidaInicio, config.comidaFin);
  const horaFinEstimada = toDateTimeLocalString(new Date(cursor));
  const excedeFin = !!config.fechaFin && horaFinEstimada > config.fechaFin;
  return { porTorneo, horaFinEstimada, excedeFin };
}

function programarPartidosGrupo(torneo) {
  const { porTorneo, horaFinEstimada, excedeFin } = programarPartidosBloque([torneo]);
  return { partidos: porTorneo[torneo.id], horaFinEstimada, excedeFin };
}

// Asigna árbitro a cada partido de grupo: un equipo del mismo torneo (misma categoría,
// por construcción, ya que solo se mira dentro de sus propios equipos) que no juegue
// en esa franja horaria. Reparte el arbitraje lo más equitativamente posible entre los
// equipos libres de cada franja; si no hay bastantes libres para todos los partidos
// simultáneos, esos partidos se quedan sin árbitro (no se reutiliza un equipo ocupado).
function asignarArbitros(equiposTorneo, partidos) {
  const contador = {};
  equiposTorneo.forEach(e => { contador[e.id] = 0; });

  const porHora = {};
  partidos.forEach(p => {
    const key = p.horaInicio || '';
    if (!porHora[key]) porHora[key] = [];
    porHora[key].push(p);
  });

  const resultado = partidos.map(p => ({ ...p, arbitro: null }));
  const porId = {};
  resultado.forEach(p => { porId[p.id] = p; });

  Object.keys(porHora).sort().forEach(hora => {
    const partidosSlot = porHora[hora];
    const ocupados = new Set(partidosSlot.flatMap(p => [p.equipoA.id, p.equipoB.id]));
    const libres = equiposTorneo
      .filter(e => !ocupados.has(e.id))
      .sort((a, b) => contador[a.id] - contador[b.id]);
    const usados = new Set();
    partidosSlot.forEach(p => {
      const candidato = libres.find(e => !usados.has(e.id));
      if (!candidato) return;
      porId[p.id].arbitro = { id: candidato.id, nombre: candidato.nombre };
      usados.add(candidato.id);
      contador[candidato.id]++;
    });
  });

  return resultado;
}

// Un cambio "estructural" en los equipos (añadir, quitar, o cualquier id nuevo) invalida
// los grupos ya sorteados; un simple renombrado (mismos ids) no.
function equiposCambianEstructura(actuales, nuevos) {
  if (actuales.length !== nuevos.length) return true;
  const idsActuales = new Set(actuales.map(e => e.id));
  return nuevos.some(e => !e.id || !idsActuales.has(e.id));
}

// Aplica un renombrado de equipos (por id) a todas las copias que el torneo tiene
// embebidas: equipos, grupos, partidos de grupo (incluido el árbitro) y eliminatoria.
// No toca nada más, así que resultados y horarios ya calculados se mantienen intactos.
function renombrarEquiposEnTorneo(torneo, renombres) {
  if (!renombres || Object.keys(renombres).length === 0) return torneo;
  const conNuevoNombre = (e) => (e && renombres[e.id]) ? { ...e, nombre: renombres[e.id] } : e;
  return {
    ...torneo,
    equipos: torneo.equipos.map(conNuevoNombre),
    grupos: (torneo.grupos || []).map(g => ({ ...g, equipos: g.equipos.map(conNuevoNombre) })),
    partidosGrupo: (torneo.partidosGrupo || []).map(p => ({
      ...p,
      equipoA: conNuevoNombre(p.equipoA),
      equipoB: conNuevoNombre(p.equipoB),
      arbitro: p.arbitro ? conNuevoNombre(p.arbitro) : null
    })),
    eliminatoria: torneo.eliminatoria ? {
      rondas: torneo.eliminatoria.rondas.map(r => ({
        ...r,
        partidos: r.partidos.map(p => ({
          ...p,
          equipoA: conNuevoNombre(p.equipoA),
          equipoB: conNuevoNombre(p.equipoB)
        }))
      }))
    } : null
  };
}

function calcularClasificacionGrupo(torneo, grupoId) {
  const grupo = (torneo.grupos || []).find(g => g.id === grupoId);
  if (!grupo) return [];
  const stats = {};
  grupo.equipos.forEach(eq => {
    stats[eq.id] = { equipo: eq, puntos: 0, jugados: 0, ganados: 0, favor: 0, contra: 0, diferencia: 0 };
  });
  (torneo.partidosGrupo || []).forEach(p => {
    if (p.grupoId !== grupoId) return;
    if (p.puntosA == null || p.puntosB == null) return;
    const a = stats[p.equipoA.id];
    const b = stats[p.equipoB.id];
    if (!a || !b) return;
    a.jugados += 1; b.jugados += 1;
    a.favor += p.puntosA; a.contra += p.puntosB;
    b.favor += p.puntosB; b.contra += p.puntosA;
    if (p.puntosA > p.puntosB) { a.puntos += 2; a.ganados += 1; }
    else if (p.puntosB > p.puntosA) { b.puntos += 2; b.ganados += 1; }
  });
  const lista = Object.values(stats).map(s => ({ ...s, diferencia: s.favor - s.contra }));
  lista.sort((x, y) => {
    if (y.puntos !== x.puntos) return y.puntos - x.puntos;
    if (y.diferencia !== x.diferencia) return y.diferencia - x.diferencia;
    return x.equipo.nombre.localeCompare(y.equipo.nombre);
  });
  return lista;
}

// Para cada campo (compartido con los torneos simultáneos del mismo bloque), calcula
// qué partido es "el actual": el más próximo sin resultado en orden de horario, que es
// el que puede jugarse en cuanto el campo quede libre. Los partidos con resultado se
// marcan como jugados (siguen siendo editables); el resto queda sin marcar.
function calcularEstadoPartidosPorCampo(torneo) {
  const bloque = torneosDelBloque(torneo);
  const porCampo = {};
  bloque.forEach(t => {
    (t.partidosGrupo || []).forEach(p => {
      if (p.campo == null) return;
      if (!porCampo[p.campo]) porCampo[p.campo] = [];
      porCampo[p.campo].push(p);
    });
  });
  const estado = {};
  Object.values(porCampo).forEach(lista => {
    lista.sort((a, b) => (a.horaInicio || '').localeCompare(b.horaInicio || ''));
    let asignadoActual = false;
    lista.forEach(p => {
      if (p.puntosA != null && p.puntosB != null) {
        estado[p.id] = 'jugado';
      } else if (!asignadoActual) {
        estado[p.id] = 'actual';
        asignadoActual = true;
      }
    });
  });
  return estado;
}

function puedeGenerarEliminatorias(torneo) {
  if (!torneo.grupos || torneo.grupos.length === 0) return false;
  // Si algún grupo tiene un solo equipo no genera partidos: se puede pasar directo a eliminatorias.
  return (torneo.partidosGrupo || []).every(p => p.puntosA != null && p.puntosB != null);
}

// Orden clásico de seeding de un cuadro: seed 1 y 2 solo pueden verse en la final,
// seeds 1-4 solo desde semifinales, etc. Ej: bracketOrder(8) = [1,8,4,5,2,7,3,6]
function bracketOrder(tamano) {
  let orden = [1];
  while (orden.length < tamano) {
    const nuevoTamano = orden.length * 2;
    const siguiente = [];
    orden.forEach(seed => {
      siguiente.push(seed);
      siguiente.push(nuevoTamano + 1 - seed);
    });
    orden = siguiente;
  }
  return orden;
}

function sizeToRoundName(numPartidosEnRonda) {
  if (numPartidosEnRonda === 1) return 'Final';
  if (numPartidosEnRonda === 2) return 'Semifinal';
  if (numPartidosEnRonda === 4) return 'Cuartos de final';
  if (numPartidosEnRonda === 8) return 'Octavos de final';
  return `Ronda de ${numPartidosEnRonda * 2}`;
}

function crearEmparejamientosPrimeraRonda(torneo) {
  const q = torneo.clasificadosPorGrupo;
  const grupos = torneo.grupos;
  // 1. Seeds por niveles: 1os de cada grupo, luego 2os de cada grupo, etc.
  const seeds = [];
  for (let rankLevel = 0; rankLevel < q; rankLevel++) {
    grupos.forEach(grupo => {
      const clasificacion = calcularClasificacionGrupo(torneo, grupo.id);
      const clasificado = clasificacion[rankLevel];
      seeds.push({ ...clasificado.equipo, grupoId: grupo.id });
    });
  }

  const tamano = seeds.length;
  const orden = bracketOrder(tamano);
  const slots = orden.map(seedNum => seeds[seedNum - 1]);

  const pares = [];
  for (let i = 0; i < tamano; i += 2) {
    pares.push([slots[i], slots[i + 1]]);
  }

  // 2. Corregir choques de equipos del mismo grupo en primera ronda.
  for (let i = 0; i < pares.length; i++) {
    const [a, b] = pares[i];
    if (a.grupoId !== b.grupoId) continue;
    for (let j = 0; j < pares.length; j++) {
      if (j === i) continue;
      const [c, d] = pares[j];
      if (c.grupoId !== a.grupoId && c.grupoId !== b.grupoId && d.grupoId !== a.grupoId) {
        pares[i][1] = d;
        pares[j][1] = b;
        break;
      }
    }
  }

  return pares;
}

function evaluarSetsGanados(partido, lado) {
  let count = 0;
  (partido.sets || []).forEach(s => {
    if (s.puntosA == null || s.puntosB == null) return;
    if (lado === 'A' && s.puntosA > s.puntosB) count++;
    if (lado === 'B' && s.puntosB > s.puntosA) count++;
  });
  return count;
}

function evaluarGanadorPartido(partido, numSets) {
  const setsParaGanar = Math.ceil((numSets || NUM_SETS_DEFAULT) / 2);
  let setsA = 0, setsB = 0;
  (partido.sets || []).forEach(s => {
    if (s.puntosA == null || s.puntosB == null) return;
    if (s.puntosA > s.puntosB) setsA += 1;
    else if (s.puntosB > s.puntosA) setsB += 1;
  });
  if (setsA >= setsParaGanar) return partido.equipoA.id;
  if (setsB >= setsParaGanar) return partido.equipoB.id;
  return null;
}

// Un set/partido a puntos se gana llegando al menos a "puntosPorSet" con 2 de ventaja;
// para que no se alargue indefinidamente, alcanzar "puntosMaximo" gana directamente
// aunque la ventaja sea de un solo punto (p.ej. a 15 con tope 21: gana 15-13, 18-16 o
// 21-20, pero no 15-14 ni 16-15).
function esResultadoValido(puntosA, puntosB, puntosPorSet, puntosMaximo) {
  if (puntosA == null || puntosB == null) return true;
  if (puntosA === puntosB) return false;
  const max = Math.max(puntosA, puntosB);
  const diferencia = Math.abs(puntosA - puntosB);
  if (max > puntosMaximo) return false;
  if (max === puntosMaximo) return true;
  return max >= puntosPorSet && diferencia >= 2;
}

function avanzarGanador(eliminatoria, rondaIdx, partidoIdx) {
  if (rondaIdx + 1 >= eliminatoria.rondas.length) return;
  const partido = eliminatoria.rondas[rondaIdx].partidos[partidoIdx];
  if (!partido.ganadorId) return;
  const ganador = (partido.equipoA && partido.equipoA.id === partido.ganadorId) ? partido.equipoA : partido.equipoB;
  const siguienteIdx = Math.floor(partidoIdx / 2);
  const siguiente = eliminatoria.rondas[rondaIdx + 1].partidos[siguienteIdx];
  if (partidoIdx % 2 === 0) siguiente.equipoA = ganador;
  else siguiente.equipoB = ganador;
}

async function confirmNewRed() {
  const { fecha, nombre, balon, lineas } = newRedData;
  if (!nombre.trim() || !balon.trim() || !lineas.trim()) {
    alert('Debe rellenar el nombre del creador, balón y líneas');
    return;
  }

  let nuevoNumero = 0;
  await updateLista(fecha, prev => {
    nuevoNumero = prev.redes.length + 1;
    const nuevaRed = newRed(nuevoNumero);
    nuevaRed.materiales.balon = balon;
    nuevaRed.materiales.lineas = lineas;
    nuevaRed.materiales.red = nombre;
    const capacidad = capacityForRed(nuevaRed);

    const esperaOrdenada = [...(prev.espera || [])].sort((a, b) => (a.ts || 0) - (b.ts || 0));
    const aPromover = esperaOrdenada.slice(0, capacidad - 1);
    const idsPromovidos = new Set(aPromover.map(p => p.id));

    nuevaRed.jugadores = aPromover.slice();

    const creador = { id: uid(), nombre, hora: '—', ts: Date.now(), owner: DEVICE_ID };
    nuevaRed.jugadores.unshift(creador);

    if (balon.trim() !== nombre && nuevaRed.jugadores.length < capacidad) {
      nuevaRed.jugadores.push({ id: uid(), nombre: balon, hora: '—', ts: Date.now(), owner: DEVICE_ID });
    }

    if (lineas.trim() !== nombre && lineas.trim() !== balon && nuevaRed.jugadores.length < capacidad) {
      nuevaRed.jugadores.push({ id: uid(), nombre: lineas, hora: '—', ts: Date.now(), owner: DEVICE_ID });
    }

    return {
      ...prev,
      espera: (prev.espera || []).filter(p => !idsPromovidos.has(p.id)),
      redes: [...prev.redes, nuevaRed],
      historial: agregarHistorial(prev.historial, `🏐 ${nombre} creó la ${nuevoNumero}ª red`)
    };
  });

  showNewRedModal = false;
  showNotify(`🏐 Nueva ${nuevoNumero}ª red abierta por ${nombre}. ¡Apuntaos aquí! ${urlParaFecha(fecha)}`);
}

function sendConvocatoria(fecha) {
  showNotify(`📣 Lista abierta ${formatFechaLarga(fecha)}. ¡Apúntate aquí! ${urlParaFecha(fecha)}`);
}
function deleteRed(fecha, id) {
  const lista = getLista(fecha);
  const red = lista.redes.find(r => r.id === id);
  const etiqueta = red ? `la ${red.numero}ª red` : 'esta red';
  if (!confirm(`¿Seguro que quieres borrar ${etiqueta}? Se perderán todos sus jugadores y lista de espera.`)) return;
  updateLista(fecha, prev => ({
    ...prev,
    redes: prev.redes.filter(r => r.id !== id).map((r, i) => ({ ...r, numero: i + 1 }))
  }));
  showNotify(`⚠️ Se ha borrado ${etiqueta} del ${formatFechaLarga(fecha)}.`);
}

function deleteLista(fecha) {
  if (!confirm(`¿Borrar toda la lista del ${formatFechaLarga(fecha)}? Se perderá todo lo apuntado.`)) return;
  update(prev => {
    const listas = { ...prev.listas };
    delete listas[fecha];
    return { ...prev, listas };
  });
  goToCalendar();
  showNotify(`🗑️ Se ha borrado la lista completa del ${formatFechaLarga(fecha)}.`);
}

function setLugar(fecha, val) {
  updateLista(fecha, prev => ({ ...prev, lugar: val }), { render: false });
}

function setMaterial(fecha, redId, tipo, nombre) {
  updateLista(fecha, prev => ({
    ...prev,
    redes: prev.redes.map(r => r.id === redId
      ? { ...r, materiales: { ...r.materiales, [tipo]: nombre } }
      : r)
  }));
}

function joinRed(fecha, redId, nombre, hora) {
  updateLista(fecha, prev => {
    const entry = { id: uid(), nombre, hora, ts: Date.now(), owner: DEVICE_ID };
    const red = prev.redes.find(r => r.id === redId);
    if (red && red.jugadores.length < capacityForRed(red)) {
      return {
        ...prev,
        redes: prev.redes.map(r => r.id === redId
          ? { ...r, jugadores: [...r.jugadores, entry] }
          : r)
      };
    }
    // Red llena: solo se admite pasar a la espera si NINGUNA red tiene hueco.
    if (hayRedConHueco(prev.redes)) return prev;
    return { ...prev, espera: [...(prev.espera || []), entry] };
  });
}

function updateHora(fecha, redId, entryId, nuevaHora) {
  const hora = nuevaHora || '—';
  updateLista(fecha, prev => ({
    ...prev,
    redes: prev.redes.map(r => r.id !== redId ? r : {
      ...r,
      jugadores: r.jugadores.map(p => p.id === entryId ? { ...p, hora } : p)
    })
  }));
}

function updateHoraEspera(fecha, entryId, nuevaHora) {
  const hora = nuevaHora || '—';
  updateLista(fecha, prev => ({
    ...prev,
    espera: (prev.espera || []).map(p => p.id === entryId ? { ...p, hora } : p)
  }));
}

async function removeFromRed(fecha, redId, entryId) {
  const lista = getLista(fecha);
  const red = lista.redes.find(r => r.id === redId);
  const persona = red?.jugadores.find(p => p.id === entryId);
  const nombre = persona ? persona.nombre : 'esta persona';

  if (!red || !puedeGestionarRed(red, persona)) {
    alert('Solo esa persona, el creador de la red o un admin pueden quitar a alguien.');
    return;
  }

  const esPropia = persona && persona.owner === DEVICE_ID;
  const aviso = esPropia
    ? `Para quitarte de la ${red.numero}ª red, escribe tu nombre exacto:`
    : `Para quitar a ${nombre} de la ${red.numero}ª red, escribe su nombre exacto:`;
  const escrito = prompt(aviso);
  if (escrito === null) return;
  if (escrito.trim() !== nombre.trim()) {
    alert('El nombre no coincide. No se ha quitado a nadie.');
    return;
  }

  const textoHistorial = esPropia
    ? `➖ ${nombre} se quitó de la ${red.numero}ª red`
    : `➖ Se quitó a ${nombre} de la ${red.numero}ª red`;

  let nombrePromovido = null;
  await updateLista(fecha, prev => {
    const esperaOrdenada = [...(prev.espera || [])].sort((a, b) => (a.ts || 0) - (b.ts || 0));
    if (esperaOrdenada.length > 0) nombrePromovido = esperaOrdenada[0].nombre;
    return {
      ...prev,
      espera: esperaOrdenada.slice(1),
      redes: prev.redes.map(r => {
        if (r.id !== redId) return r;
        const jugadores = r.jugadores.filter(e => e.id !== entryId);
        if (esperaOrdenada.length > 0) jugadores.push(esperaOrdenada[0]);
        return { ...r, jugadores };
      }),
      historial: agregarHistorial(prev.historial, textoHistorial)
    };
  });

  let mensaje = `❌ ${nombre} se ha quitado de la ${red?.numero}ª red del ${formatFechaLarga(fecha)}.`;
  if (nombrePromovido) {
    mensaje += ` ✅ ${nombrePromovido} subió automáticamente de la lista de espera.`;
  }
  showNotify(mensaje);
}

function removeFromEspera(fecha, entryId) {
  const lista = getLista(fecha);
  const persona = (lista.espera || []).find(p => p.id === entryId);
  const nombre = persona ? persona.nombre : 'esta persona';

  if (!puedeGestionarEspera(lista, persona)) {
    alert('Solo esa persona, el creador de una red o un admin pueden quitar a alguien.');
    return;
  }

  const esPropia = persona && persona.owner === DEVICE_ID;
  const aviso = esPropia
    ? 'Para quitarte de la lista de espera, escribe tu nombre exacto:'
    : `Para quitar a ${nombre} de la lista de espera, escribe su nombre exacto:`;
  const escrito = prompt(aviso);
  if (escrito === null) return;
  if (escrito.trim() !== nombre.trim()) {
    alert('El nombre no coincide. No se ha quitado a nadie.');
    return;
  }

  const textoHistorial = esPropia
    ? `➖ ${nombre} se quitó de la lista de espera`
    : `➖ Se quitó a ${nombre} de la lista de espera`;

  updateLista(fecha, prev => ({
    ...prev,
    espera: (prev.espera || []).filter(p => p.id !== entryId),
    historial: agregarHistorial(prev.historial, textoHistorial)
  }));
}

function getAllMembers(lista) {
  const set = new Set();
  const redes = (lista && Array.isArray(lista.redes)) ? lista.redes : [];
  redes.forEach(r => (r.jugadores || []).forEach(j => set.add(j.nombre)));
  (lista && lista.espera || []).forEach(j => set.add(j.nombre));
  return [...set].sort();
}

  const opciones = opcionesClasificados(comp.numEquipos, comp.numGrupos);

// Los nombres de equipo no se re-renderizan al escribir, así que hay que leerlos
// del DOM antes de rehacer la lista con el nuevo tamaño.
function onNumEquiposChangeTorneo(i, value) {
  const comp = newTorneoData.competiciones[i];
  const nombresCapturados = (comp.equiposNombres || []).map((n, j) => {
    const el = document.getElementById(`torneo-${i}-equipo-${j}`);
    return el ? el.value : n;
  });
  const numEquipos = Math.max(2, parseInt(value, 10) || 0);
  const numGrupos = sugerirNumGrupos(numEquipos);
  newTorneoData.competiciones[i] = {
    ...comp,
    numEquipos,
    equiposNombres: Array.from({ length: numEquipos }, (_, j) => nombresCapturados[j] || ''),
    numGrupos,
    clasificadosPorGrupo: sugerirClasificados(),
    numPartidosGrupo: sugerirNumPartidos(numEquipos, numGrupos)
  };
  render();
}

async function confirmNewTorneo() {
  const d = newTorneoData;
  const nombre = (d.nombre || '').trim();
  if (!nombre) { alert('Debes indicar un nombre para el torneo'); return; }
  if (!d.fechaInicio || !d.fechaFin) { alert('Debes indicar fecha y hora de inicio y de fin'); return; }
  if (d.fechaFin <= d.fechaInicio) { alert('La fecha de fin debe ser posterior a la de inicio'); return; }
  const errorComida = validarComida(d.comidaInicio, d.comidaFin);
  if (errorComida) { alert(errorComida); return; }

  const activas = competicionesActivas(d);
  const dos = activas.length > 1;

  for (let i = 0; i < activas.length; i++) {
    const nombres = (activas[i].equiposNombres || []).map(n => (n || '').trim());
    if (nombres.length < 2 || nombres.some(n => !n)) {
      alert(dos
        ? `Torneo ${i + 1} (${activas[i].categoria}): debes indicar el nombre de todos los equipos`
        : 'Debes indicar el nombre de todos los equipos');
      return;
    }
  }

  const validacion = validarTorneoModal(d);
  if (!validacion.valid) {
    alert(validacion.error.replace('⚠️ ', ''));
    return;
  }

  const bloqueId = dos ? uid() : null;
  const torneos = activas.map((comp, i) => emptyTorneo({
    nombre,
    categoria: comp.categoria,
    fechaInicio: d.fechaInicio,
    fechaFin: d.fechaFin,
    puntosPorSet: d.puntosPorSet,
    puntosMaximo: d.puntosMaximo,
    numSets: d.numSets,
    numCampos: d.numCampos,
    duracionPartidoMin: d.duracionPartidoMin,
    comidaInicio: d.comidaInicio || null,
    comidaFin: d.comidaFin || null,
    equipos: comp.equiposNombres.map(n => newEquipo(n.trim())),
    numGrupos: comp.numGrupos,
    numPartidosGrupo: comp.numPartidosGrupo,
    clasificadosPorGrupo: comp.clasificadosPorGrupo,
    bloqueId,
    ordenBloque: i
  }));

  await update(prev => {
    const mapa = { ...prev.torneos };
    torneos.forEach(t => { mapa[t.id] = t; });
    return { ...prev, torneos: mapa };
  });
  showNewTorneoModal = false;
  openTorneo(torneos[0].id);
}

async function confirmEditarTorneo() {
  const d = editTorneoData;
  const torneo = getTorneo(d.torneoId);
  if (!torneo) { closeEditarTorneoModal(); return; }

  const nombre = (d.nombre || '').trim();
  if (!nombre) { alert('Debes indicar un nombre para el torneo'); return; }
  if (!d.fechaInicio || !d.fechaFin) { alert('Debes indicar fecha y hora de inicio y de fin'); return; }
  if (d.fechaFin <= d.fechaInicio) { alert('La fecha de fin debe ser posterior a la de inicio'); return; }
  const errorComida = validarComida(d.comidaInicio, d.comidaFin);
  if (errorComida) { alert(errorComida); return; }

  const equiposNombres = d.equipos.map(e => (e.nombre || '').trim());
  if (equiposNombres.length < 2 || equiposNombres.some(n => !n)) {
    alert('Debes indicar el nombre de todos los equipos');
    return;
  }

  const errorComp = validarCompeticion({ numGrupos: d.numGrupos, clasificadosPorGrupo: d.clasificadosPorGrupo, numEquipos: d.equipos.length });
  if (errorComp) { alert(errorComp); return; }

  const errorFormato = validarFormatoPartido(d);
  if (errorFormato) { alert(errorFormato); return; }

  // Los equipos que ya existían conservan su id (para que clasificación/histórico sigan
  // hablando del mismo equipo); los añadidos en este modal (id null) se crean ahora.
  const equiposFinal = d.equipos.map((e, i) => e.id ? { id: e.id, nombre: equiposNombres[i] } : newEquipo(equiposNombres[i]));

  const cambioEstructura = equiposCambianEstructura(torneo.equipos, equiposFinal)
    || d.numGrupos !== torneo.numGrupos
    || d.clasificadosPorGrupo !== torneo.clasificadosPorGrupo;

  // Sin cambio estructural, un mismo id con nombre distinto es un renombrado: se aplica
  // en cascada a grupos/partidos/árbitros/eliminatoria en vez de perder el sorteo.
  const renombres = {};
  if (!cambioEstructura) {
    equiposFinal.forEach(e => {
      const original = torneo.equipos.find(o => o.id === e.id);
      if (original && original.nombre !== e.nombre) renombres[e.id] = e.nombre;
    });
  }

  const camposCompartidosNuevos = {
    nombre, fechaInicio: d.fechaInicio, fechaFin: d.fechaFin,
    puntosPorSet: d.puntosPorSet, puntosMaximo: d.puntosMaximo, numSets: d.numSets,
    numCampos: d.numCampos, duracionPartidoMin: d.duracionPartidoMin,
    comidaInicio: d.comidaInicio || null, comidaFin: d.comidaFin || null
  };
  const cambianCompartidos = CAMPOS_COMPARTIDOS_BLOQUE.some(c => camposCompartidosNuevos[c] !== torneo[c]);
  const bloqueConCompartidos = torneosDelBloque(torneo).map(t => ({ ...t, ...camposCompartidosNuevos }));

  // El número de sets solo afecta al cuadro de eliminatorias (la fase de grupos
  // siempre juega un único set): si ya hay un cuadro generado con otro número de
  // sets, sus resultados dejan de tener sentido y hay que reiniciarlo.
  const cambiaNumSets = d.numSets !== torneo.numSets && torneo.eliminatoria;
  if (cambiaNumSets && !confirm('Cambiar el número de sets por partido reiniciará el cuadro de eliminatorias actual (se perderán sus resultados). ¿Continuar?')) return;

  if (cambioEstructura) {
    if (torneo.grupos) {
      if (!confirm('Cambiar los equipos o los grupos requiere volver a sortear. Se perderán los resultados de la fase de grupos y el cuadro de eliminatorias actuales. ¿Continuar?')) return;
    }
    const torneoEditado = {
      ...torneo,
      ...camposCompartidosNuevos,
      equipos: equiposFinal,
      numGrupos: d.numGrupos,
      clasificadosPorGrupo: d.clasificadosPorGrupo,
      numPartidosGrupo: d.numPartidosGrupo
    };
    if (torneo.grupos) {
      ejecutarSorteo(torneoEditado, bloqueConCompartidos.map(t => t.id === torneo.id ? torneoEditado : t));
    } else {
      // Aún no se han sorteado grupos: basta con guardar la configuración nueva.
      guardarCambiosSinResortear(torneo.id, torneoEditado, bloqueConCompartidos);
    }
  } else {
    let torneoPropio = { ...torneo, ...camposCompartidosNuevos, numPartidosGrupo: d.numPartidosGrupo };
    if (cambiaNumSets) {
      torneoPropio = { ...torneoPropio, eliminatoria: null };
    }
    if (Object.keys(renombres).length > 0) {
      torneoPropio = renombrarEquiposEnTorneo(torneoPropio, renombres);
    }
    if (cambianCompartidos && torneosDelBloque(torneo).some(t => t.grupos)) {
      reprogramarBloque(bloqueConCompartidos.map(t => t.id === torneo.id ? torneoPropio : t));
    } else {
      guardarCambiosSinResortear(torneo.id, torneoPropio, bloqueConCompartidos);
    }
  }

  showEditarTorneoModal = false;
  render();
}

// Campos que un torneo simultáneo comparte con sus hermanos de bloque (ver
// torneosDelBloque): al editarlos hay que mantenerlos sincronizados, porque
// programarPartidosBloque solo usa la configuración del primero del bloque.
const CAMPOS_COMPARTIDOS_BLOQUE = ['nombre', 'fechaInicio', 'fechaFin', 'puntosPorSet', 'puntosMaximo', 'numSets', 'numCampos', 'duracionPartidoMin', 'comidaInicio', 'comidaFin'];

function soloCamposCompartidos(t) {
  const campos = {};
  CAMPOS_COMPARTIDOS_BLOQUE.forEach(c => { campos[c] = t[c]; });
  return campos;
}

// Baraja los equipos de torneoConDatos, arma grupos nuevos, genera y programa sus
// partidos (junto con los del resto del bloque) y asigna árbitros. torneoConDatos puede
// venir tal cual está en `state` (sortearGrupos) o con campos ya editados sin guardar
// todavía (confirmEditarTorneo) — en ambos casos el resultado se escribe de una vez.
function ejecutarSorteo(torneoConDatos, bloqueBase) {
  const equipos = [...torneoConDatos.equipos];
  for (let i = equipos.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [equipos[i], equipos[j]] = [equipos[j], equipos[i]];
  }

  const numGrupos = torneoConDatos.numGrupos;
  const letras = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const grupos = Array.from({ length: numGrupos }, (_, i) => ({ id: uid(), nombre: `Grupo ${letras[i] || (i + 1)}`, equipos: [] }));
  equipos.forEach((eq, i) => {
    grupos[i % numGrupos].equipos.push(eq);
  });
  const partidosSinProgramar = generarPartidosGrupo(grupos);

  // Al cambiar las tandas de este torneo se desplazan las franjas de sus torneos
  // simultáneos, así que hay que reprogramar el bloque entero. A los hermanos solo
  // se les recolocan hora y campo: sus partidos y resultados se mantienen.
  const torneoConNuevosPartidos = { ...torneoConDatos, partidosGrupo: partidosSinProgramar };
  const bloque = bloqueBase.map(t => t.id === torneoConDatos.id ? torneoConNuevosPartidos : t);
  const { porTorneo, excedeFin } = programarPartidosBloque(bloque);

  if (excedeFin) {
    alert('⚠️ Con los campos y la duración configurados, la fase de grupos no cabe antes de la fecha/hora de fin del torneo. Se ha generado igualmente el horario completo.');
  }

  // El árbitro se asigna por torneo (equipos de la propia categoría), una vez ya
  // repartidas hora y campo de todo el bloque.
  const porTorneoConArbitros = {};
  bloque.forEach(t => {
    porTorneoConArbitros[t.id] = asignarArbitros(t.equipos, porTorneo[t.id]);
  });

  update(prev => {
    const torneos = { ...prev.torneos };
    bloque.forEach(t => {
      const id = t.id;
      if (!torneos[id]) return;
      if (id === torneoConDatos.id) {
        torneos[id] = {
          ...torneos[id],
          ...soloCamposCompartidos(torneoConDatos),
          equipos: torneoConDatos.equipos,
          numGrupos: torneoConDatos.numGrupos,
          clasificadosPorGrupo: torneoConDatos.clasificadosPorGrupo,
          numPartidosGrupo: torneoConDatos.numPartidosGrupo,
          grupos,
          partidosGrupo: porTorneoConArbitros[id],
          sorteoConfirmado: false,
          eliminatoria: null,
          historial: agregarHistorial(torneos[id].historial, `🎲 Sorteo de grupos realizado (${numGrupos} grupos)`)
        };
      } else {
        torneos[id] = { ...torneos[id], ...soloCamposCompartidos(t), partidosGrupo: porTorneoConArbitros[id] };
      }
    });
    return { ...prev, torneos };
  });
}

function sortearGrupos(torneoId) {
  const torneo = getTorneo(torneoId);
  if (!torneo) return;
  if (torneo.sorteoConfirmado) {
    if (!confirm('Ya hay resultados registrados en la fase de grupos. ¿Seguro que quieres volver a sortear? Se perderán los resultados de grupos y el cuadro de eliminatorias.')) return;
  }
  ejecutarSorteo(torneo, torneosDelBloque(torneo));
}

// Reprograma horas/campos/árbitros de todo el bloque sin tocar grupos ni resultados
// (usado al editar campos compartidos como nº de campos/duración/fechas cuando ya hay
// grupos sorteados). bloqueActualizado ya trae los campos compartidos con sus valores nuevos.
function reprogramarBloque(bloqueActualizado) {
  const { porTorneo, excedeFin } = programarPartidosBloque(bloqueActualizado);
  if (excedeFin) {
    alert('⚠️ Con los campos y la duración configurados, la fase de grupos no cabe antes de la fecha/hora de fin del torneo. Se ha generado igualmente el horario completo.');
  }
  const porTorneoConArbitros = {};
  bloqueActualizado.forEach(t => {
    porTorneoConArbitros[t.id] = asignarArbitros(t.equipos, porTorneo[t.id]);
  });
  update(prev => {
    const torneos = { ...prev.torneos };
    bloqueActualizado.forEach(t => {
      if (!torneos[t.id]) return;
      torneos[t.id] = { ...torneos[t.id], ...soloCamposCompartidos(t), partidosGrupo: porTorneoConArbitros[t.id] };
    });
    return { ...prev, torneos };
  });
}

// Guarda cambios que no requieren tocar el sorteo: campos compartidos del bloque en
// todos sus torneos, y los campos propios (incluido un posible renombrado de equipos
// ya aplicado a torneoPropioActualizado) solo en el torneo editado.
function guardarCambiosSinResortear(torneoId, torneoPropioActualizado, bloqueActualizado) {
  update(prev => {
    const torneos = { ...prev.torneos };
    bloqueActualizado.forEach(t => {
      if (!torneos[t.id]) return;
      if (t.id === torneoId) {
        torneos[t.id] = {
          ...torneoPropioActualizado,
          ...soloCamposCompartidos(t)
        };
      } else {
        torneos[t.id] = { ...torneos[t.id], ...soloCamposCompartidos(t) };
      }
    });
    return { ...prev, torneos };
  });
}

function setResultadoPartidoGrupo(torneoId, partidoId, puntosA, puntosB) {
  const a = (puntosA === '' || puntosA == null) ? null : Math.max(0, parseInt(puntosA, 10) || 0);
  const b = (puntosB === '' || puntosB == null) ? null : Math.max(0, parseInt(puntosB, 10) || 0);
  const torneo = getTorneo(torneoId);
  if (torneo && !esResultadoValido(a, b, torneo.puntosPorSet, torneo.puntosMaximo)) {
    alert(`Resultado no válido: hay que ganar por 2 puntos de diferencia a partir de ${torneo.puntosPorSet} (o llegar directamente a ${torneo.puntosMaximo}).`);
    render();
    return;
  }
  updateTorneo(torneoId, prev => ({
    ...prev,
    partidosGrupo: prev.partidosGrupo.map(p => p.id === partidoId ? { ...p, puntosA: a, puntosB: b } : p),
    sorteoConfirmado: (a != null && b != null) ? true : prev.sorteoConfirmado
  }));
}

function generarEliminatorias(torneoId) {
  const torneo = getTorneo(torneoId);
  if (!torneo || !puedeGenerarEliminatorias(torneo)) return;
  if (torneo.eliminatoria) {
    const hayProgreso = torneo.eliminatoria.rondas.some(r => r.partidos.some(p => p.ganadorId));
    if (hayProgreso && !confirm('Ya hay resultados en el cuadro de eliminatorias. ¿Seguro que quieres regenerarlo? Se perderán.')) return;
  }

  const pares = crearEmparejamientosPrimeraRonda(torneo);

  const rondas = [];
  let n = pares.length;
  while (true) {
    const partidos = [];
    for (let i = 0; i < n; i++) {
      partidos.push({
        id: uid(),
        slotIndex: i,
        equipoA: null,
        equipoB: null,
        sets: Array.from({ length: torneo.numSets || NUM_SETS_DEFAULT }, () => ({ puntosA: null, puntosB: null })),
        ganadorId: null
      });
    }
    rondas.push({ nombre: sizeToRoundName(n), partidos });
    if (n === 1) break;
    n = n / 2;
  }
  rondas[0].partidos.forEach((partido, i) => {
    partido.equipoA = pares[i][0];
    partido.equipoB = pares[i][1];
  });

  updateTorneo(torneoId, prev => ({
    ...prev,
    eliminatoria: { rondas },
    historial: agregarHistorial(prev.historial, `🏆 Cuadro de eliminatorias generado (${pares.length * 2} equipos)`)
  }));
}

function setResultadoSetEliminatoria(torneoId, partidoId, setIndex, puntosA, puntosB) {
  const a = (puntosA === '' || puntosA == null) ? null : Math.max(0, parseInt(puntosA, 10) || 0);
  const b = (puntosB === '' || puntosB == null) ? null : Math.max(0, parseInt(puntosB, 10) || 0);
  const torneo = getTorneo(torneoId);
  if (torneo && !esResultadoValido(a, b, torneo.puntosPorSet, torneo.puntosMaximo)) {
    alert(`Resultado no válido: hay que ganar el set por 2 puntos de diferencia a partir de ${torneo.puntosPorSet} (o llegar directamente a ${torneo.puntosMaximo}).`);
    render();
    return;
  }

  updateTorneo(torneoId, prev => {
    const eliminatoria = JSON.parse(JSON.stringify(prev.eliminatoria));
    let rondaIdx = -1, partidoIdx = -1;
    eliminatoria.rondas.forEach((ronda, ri) => {
      ronda.partidos.forEach((p, pi) => {
        if (p.id === partidoId) { rondaIdx = ri; partidoIdx = pi; }
      });
    });
    if (rondaIdx === -1) return prev;
    const partido = eliminatoria.rondas[rondaIdx].partidos[partidoIdx];
    partido.sets[setIndex] = { puntosA: a, puntosB: b };
    partido.ganadorId = (partido.equipoA && partido.equipoB) ? evaluarGanadorPartido(partido, prev.numSets) : null;
    if (partido.ganadorId) {
      avanzarGanador(eliminatoria, rondaIdx, partidoIdx);
    }
    return { ...prev, eliminatoria };
  });
}

function deleteTorneo(torneoId) {
  const torneo = getTorneo(torneoId);
  if (!torneo) return;

  const hermanos = torneosDelBloque(torneo).filter(t => t.id !== torneoId);
  const aviso = hermanos.length > 0
    ? ` Se juega a la vez que "${nombreTorneo(hermanos[0])}", que pasará a jugarse solo y verá recolocado su horario.`
    : '';
  if (!confirm(`¿Borrar el torneo "${nombreTorneo(torneo)}"? Se perderá toda la información: equipos, grupos y eliminatorias.${aviso}`)) return;

  const estabaViendolo = view.screen === 'torneo' && view.torneoId === torneoId;

  // Si el bloque se queda con un único torneo deja de ser simultáneo: se le quita el
  // bloqueId y se recompacta su horario para que no arrastre los huecos del otro.
  let superviviente = null;
  if (hermanos.length === 1) {
    const solo = { ...hermanos[0], bloqueId: null, ordenBloque: 0 };
    const { porTorneo } = programarPartidosBloque([solo]);
    // Las horas cambian al recompactar, así que los árbitros se reasignan desde cero
    // (quién estaba "libre en ese momento" ya no es lo mismo).
    superviviente = { ...solo, partidosGrupo: asignarArbitros(solo.equipos, porTorneo[solo.id]) };
  }

  update(prev => {
    const torneos = { ...prev.torneos };
    delete torneos[torneoId];
    if (superviviente && torneos[superviviente.id]) torneos[superviviente.id] = superviviente;
    return { ...prev, torneos };
  });
  // Si se borra desde su propia vista hay que volver al calendario; si se borra
  // desde la tarjeta del calendario, update() ya vuelve a renderizar sin tocar el mes que se estaba viendo.
  if (estabaViendolo) goToCalendar();
}

function puedeGestionarTorneo(torneo) {
  if (isAdmin) return true;
  return torneo.creatorOwner === DEVICE_ID;
}

/* ---------- Permisos: quién puede quitar a quién ---------- */

// Redes sin creatorOwner son de antes de esta funcionalidad: se mantiene
// el comportamiento anterior (cualquiera puede gestionarlas) para no
// bloquear listas ya existentes.
function puedeGestionarRed(red, persona) {
  if (isAdmin) return true;
  if (persona && persona.owner === DEVICE_ID) return true;
  if (!red.creatorOwner) return true;
  return red.creatorOwner === DEVICE_ID;
}

function puedeGestionarEspera(lista, persona) {
  if (isAdmin) return true;
  if (persona && persona.owner === DEVICE_ID) return true;
  const redesConCreador = (lista.redes || []).filter(r => r.creatorOwner);
  if (redesConCreador.length === 0) return true;
  return redesConCreador.some(r => r.creatorOwner === DEVICE_ID);
}

function handleJoinClick(fecha, redId, nameInputId, timeInputId) {
  const nameInput = document.getElementById(nameInputId);

function handleJoinEspera(fecha, nameInputId, timeInputId) {
  const nameInput = document.getElementById(nameInputId);

  if (!nameInput) return;
  const nombre = nameInput.value.trim();
  if (!nombre) {
    nameInput.focus();

  const hora = (timeInput && timeInput.value) || '—';
  updateLista(fecha, prev => ({
    ...prev,

/* ---------- Render: calendario ---------- */

function renderCalendar() {
  const { calYear, calMonth } = view;
  const today = todayStr();

  const firstOfMonth = new Date(calYear, calMonth, 1);
  let startWeekday = firstOfMonth.getDay(); // 0=domingo
  startWeekday = (startWeekday + 6) % 7; // convertir a 0=lunes

  const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
  const daysInPrevMonth = new Date(calYear, calMonth, 0).getDate();

  const cells = [];
  for (let i = 0; i < startWeekday; i++) {
    const dayNum = daysInPrevMonth - startWeekday + i + 1;
    cells.push({ dayNum, inMonth: false, key: null });
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const key = formatDateKey(new Date(calYear, calMonth, d));
    cells.push({ dayNum: d, inMonth: true, key });
  }
  while (cells.length % 7 !== 0) {
    const idx = cells.length - (startWeekday + daysInMonth);
    cells.push({ dayNum: idx + 1, inMonth: false, key: null });
  }

  const daysHtml = cells.map(cell => {
    const hasList = cell.key && state.listas[cell.key];
    const torneosDia = cell.key ? torneosEnFecha(cell.key) : [];
    const hasTorneo = torneosDia.length > 0;
    const isToday = cell.key === today;
    const classes = ['cal-day'];
    if (cell.inMonth) classes.push('in-month');
    if (hasList) classes.push('has-list');
    if (hasTorneo) classes.push('has-torneo');
    if (isToday) classes.push('is-today');
    const onclick = hasList ? `onclick="openLista('${cell.key}')"` : '';

    let indicadores = '';
    let esperaCount = '';
    if (hasList) {
      const lista = state.listas[cell.key];
      const ind = [];
      if (lista.redes && lista.redes.length > 0) {
        lista.redes.forEach(red => {
          ind.push(red.jugadores.length >= capacityForRed(red) ? '🔴' : '🟢');
        });
      }
      indicadores = ind.length > 0 ? `<div class="cal-day-indicators">${ind.join(' ')}</div>` : '';

      if (lista.espera && lista.espera.length > 0) {
        esperaCount = `<div class="cal-day-espera">${lista.espera.length} en espera</div>`;
      }
    }
    const torneoMarca = hasTorneo ? `<span class="cal-day-torneo" title="${esc(torneosDia.map(nombreTorneo).join(', '))}">🏆</span>` : '';

    return `<div class="${classes.join(' ')}" ${onclick}>${cell.dayNum}${torneoMarca}${indicadores}${esperaCount}</div>`;
  }).join('');

  const weekdaysHtml = DIAS_SEMANA.map(d => `<div class="cal-weekday">${d}</div>`).join('');

  return `
    <div class="main">
      <div class="cal-toolbar">
        <button class="cal-nav-btn" onclick="calPrevMonth()">‹</button>
        <span class="cal-month-label">${MESES[calMonth]} ${calYear}</span>
        <button class="cal-nav-btn" onclick="calNextMonth()">›</button>
      </div>
      <div class="calendar-grid">
        <div class="cal-weekdays">${weekdaysHtml}</div>
        <div class="cal-days">${daysHtml}</div>
      </div>
      <button class="add-list-btn" onclick="openNewListModal()">+ Nueva lista</button>
      <button class="add-list-btn" style="margin-top: 10px;" onclick="openNewTorneoModal()">+ Nuevo torneo</button>
      ${isAdmin
        ? `<button class="admin-toggle active" onclick="logoutAdmin()">🔓 Admin activo · salir</button>`
        : `<button class="admin-toggle" onclick="loginAdmin()">🔑 Modo admin</button>`}
    </div>
  `;
}

// Selector para saltar entre los torneos que se juegan simultáneamente.
function renderSelectorBloque(torneo) {
  const bloque = torneosDelBloque(torneo);
  if (bloque.length < 2) return '';
  const pills = bloque.map(t => t.id === torneo.id
    ? `<span class="torneo-switcher-pill active">${esc(capitalizar(t.categoria))}</span>`
    : `<span class="torneo-switcher-pill" onclick="openTorneo('${t.id}')">${esc(capitalizar(t.categoria))}</span>`
  ).join('');
  return `<div class="torneo-switcher"><span class="torneo-switcher-label">⇄ A la vez:</span>${pills}</div>`;
}

function renderTorneoEquiposYGrupos(torneo) {
  const gestionar = puedeGestionarTorneo(torneo);
  if (!torneo.grupos) {
    const listaEquipos = torneo.equipos.map(e => `<div class="empty-slot" style="opacity:0.8; font-style:normal;">${esc(e.nombre)}</div>`).join('');
    return `
      <div class="empty-state" style="padding: 24px 20px 8px;">
        <div class="big">Todavía no se han sorteado los grupos</div>
        <div>${torneo.equipos.length} equipos listos para el sorteo en ${torneo.numGrupos} grupo${torneo.numGrupos !== 1 ? 's' : ''}</div>
      </div>
      <div class="players-list" style="margin-bottom: 16px;">${listaEquipos}</div>
      ${gestionar ? `<button class="add-red-btn" onclick="sortearGrupos('${torneo.id}')">🎲 Sortear grupos</button>` : ''}
    `;
  }

  const estadoCampos = calcularEstadoPartidosPorCampo(torneo);
  const gruposHtml = torneo.grupos.map(g => renderGrupoCard(torneo, g, estadoCampos)).join('');
  return `
    ${gestionar ? `<button class="add-red-btn" onclick="sortearGrupos('${torneo.id}')">🎲 Volver a sortear grupos</button>` : ''}
    ${renderHorarioGeneral(torneo, estadoCampos)}
    ${gruposHtml}
  `;
}

// El horario muestra los partidos de todo el bloque (los torneos simultáneos comparten
// pistas), etiquetando cada partido con su torneo y atenuando los del torneo hermano.
function renderHorarioGeneral(torneo, estadoCampos) {
  const bloque = torneosDelBloque(torneo);
  const hayVarios = bloque.length > 1;

  const grupoPorId = {};
  const entradas = [];
  bloque.forEach(t => {
    (t.grupos || []).forEach(g => { grupoPorId[g.id] = g.nombre; });
    (t.partidosGrupo || []).forEach(p => entradas.push({ partido: p, torneo: t }));
  });
  if (entradas.length === 0) return '';

  const porHora = {};
  entradas.forEach(e => {
    const key = e.partido.horaInicio || '';
    if (!porHora[key]) porHora[key] = [];
    porHora[key].push(e);
  });

  const { comidaInicio, comidaFin } = torneo;
  const horasOrdenadas = Object.keys(porHora).sort();
  const filas = horasOrdenadas.map((hora, idx) => {
    let filaComida = '';
    if (comidaInicio && comidaFin && hora && idx > 0) {
      const diaActual = hora.slice(0, 10);
      const horaAnterior = horasOrdenadas[idx - 1];
      if (horaAnterior.slice(0, 10) === diaActual
        && horaAnterior.slice(11, 16) < comidaInicio
        && hora.slice(11, 16) >= comidaFin) {
        filaComida = `
          <div class="horario-fila horario-comida">
            <div class="horario-hora">🍽️ ${comidaInicio}–${comidaFin}</div>
            <div class="horario-celdas"><span style="opacity:0.6;">Pausa para comer</span></div>
          </div>
        `;
      }
    }
    const celdas = porHora[hora]
      .slice()
      .sort((a, b) => (a.partido.campo || 0) - (b.partido.campo || 0))
      .map(({ partido: p, torneo: t }) => {
        const estado = estadoCampos ? estadoCampos[p.id] : null;
        const claseEstado = estado === 'jugado' ? 'campo-jugado' : (estado === 'actual' ? 'campo-actual' : '');
        return `
        <div class="horario-celda ${hayVarios && t.id !== torneo.id ? 'otro-torneo' : ''} ${claseEstado}">
          <span class="horario-campo">Campo ${p.campo}</span>
          ${hayVarios ? `<span class="horario-torneo-badge">${esc(capitalizar(t.categoria))}</span>` : ''}
          ${estado === 'actual' ? '<span class="campo-disponible">🟢 Disponible</span>' : ''}
          <span>${esc(p.equipoA.nombre)} vs ${esc(p.equipoB.nombre)}</span>
          <span style="opacity:0.5;">${esc(grupoPorId[p.grupoId] || '')}</span>
          <span class="horario-arbitro ${p.arbitro ? '' : 'pendiente'}">${p.arbitro ? `Árbitro: ${esc(p.arbitro.nombre)}` : 'Árbitro por asignar'}</span>
        </div>
      `;
      }).join('');
    return `
      ${filaComida}
      <div class="horario-fila">
        <div class="horario-hora">${hora ? formatFechaHoraCorta(hora) : '—'}</div>
        <div class="horario-celdas">${celdas}</div>
      </div>
    `;
  }).join('');

  const pendientes = hayVarios
    ? bloque.filter(t => !t.grupos).map(t => capitalizar(t.categoria))
    : [];
  const aviso = pendientes.length > 0
    ? `<div class="horario-aviso">⚠️ Falta sortear los grupos de ${pendientes.join(' y ')}. Al hacerlo, las horas se recolocarán para alternar los dos torneos.</div>`
    : '';

  return `
    <div class="red-card grupo-card">
      <div class="red-head">
        <div class="red-name-row"><span class="red-number">🗓️ Horario general</span></div>
      </div>
      <div class="players-list">${aviso}${filas}</div>
    </div>
  `;
}

function renderGrupoCard(torneo, grupo, estadoCampos) {
  const clasificacion = calcularClasificacionGrupo(torneo, grupo.id);
  const filas = clasificacion.map((s, i) => `
    <tr class="${i < torneo.clasificadosPorGrupo ? 'clasificado' : ''}">
      <td>${i + 1}</td>
      <td>${esc(s.equipo.nombre)}</td>
      <td>${s.jugados}</td>
      <td>${s.puntos}</td>
      <td>${s.diferencia > 0 ? '+' : ''}${s.diferencia}</td>
    </tr>
  `).join('');

  const partidos = torneo.partidosGrupo
    .filter(p => p.grupoId === grupo.id)
    .sort((a, b) => (a.horaInicio || '').localeCompare(b.horaInicio || '') || (a.campo || 0) - (b.campo || 0));
  const partidosHtml = partidos.map(p => renderPartidoGrupoRow(torneo, p, estadoCampos)).join('');

  return `
    <div class="red-card grupo-card">
      <div class="red-head">
        <div class="red-name-row">
          <span class="red-number">${esc(grupo.nombre)}</span>
          <span class="grupo-categoria">${esc(capitalizar(torneo.categoria))}</span>
        </div>
      </div>
      <div class="players-list">
        <table class="grupo-standings-table">
          <thead><tr><th>#</th><th>Equipo</th><th>PJ</th><th>Pts</th><th>Dif</th></tr></thead>
          <tbody>${filas}</tbody>
        </table>
      </div>
      <div class="players-list">${partidosHtml}</div>
    </div>
  `;
}

function renderPartidoGrupoRow(torneo, partido, estadoCampos) {
  const idA = `pg-a-${partido.id}`;
  const idB = `pg-b-${partido.id}`;
  const arbitroTexto = partido.arbitro
    ? `Árbitro: ${esc(partido.arbitro.nombre)}`
    : `<span class="arbitro-pendiente">Árbitro por asignar</span>`;
  const estado = estadoCampos ? estadoCampos[partido.id] : null;
  const etiquetaEstado = estado === 'actual' ? ' <span class="campo-disponible">🟢 Campo libre</span>' : '';
  const meta = partido.horaInicio
    ? `<div class="partido-meta">${formatFechaHoraCorta(partido.horaInicio)} · Campo ${partido.campo} · ${arbitroTexto}${etiquetaEstado}</div>`
    : '';
  const filaClase = estado === 'jugado' ? ' partido-jugado' : (estado === 'actual' ? ' partido-actual' : '');
  return `
    ${meta}
    <div class="player-row${filaClase}">
      <span class="player-name">${esc(partido.equipoA.nombre)}</span>
      <input type="text" inputmode="numeric" pattern="[0-9]*" id="${idA}" class="player-time-input score-input" style="width:56px; text-align:center;" value="${partido.puntosA != null ? partido.puntosA : ''}" onchange="setResultadoPartidoGrupo('${torneo.id}','${partido.id}', this.value, document.getElementById('${idB}').value)" />
      <span>–</span>
      <input type="text" inputmode="numeric" pattern="[0-9]*" id="${idB}" class="player-time-input score-input" style="width:56px; text-align:center;" value="${partido.puntosB != null ? partido.puntosB : ''}" onchange="setResultadoPartidoGrupo('${torneo.id}','${partido.id}', document.getElementById('${idA}').value, this.value)" />
      <span class="player-name" style="text-align:right;">${esc(partido.equipoB.nombre)}</span>
    </div>
  `;
}

function renderEliminatoriasSection(torneo) {
  if (!torneo.eliminatoria) {
    const puede = puedeGenerarEliminatorias(torneo);
    return `
      <div style="margin-top: 24px;">
        <button class="add-red-btn" ${puede ? '' : 'disabled'} style="${puede ? '' : 'opacity:0.4; cursor:not-allowed;'}" onclick="generarEliminatorias('${torneo.id}')">🏆 Generar eliminatorias</button>
        ${puede ? '' : '<div style="text-align:center; font-size:12px; opacity:0.6; margin-top:6px;">Completa todos los resultados de la fase de grupos para generar el cuadro.</div>'}
      </div>
    `;
  }
  return `
    <div style="margin-top: 24px;">
      <div class="cal-month-label" style="margin-bottom: 12px;">Eliminatorias</div>
      ${renderBracket(torneo)}
    </div>
  `;
}

function renderBracket(torneo) {
  const rondas = torneo.eliminatoria.rondas;
  const columnas = rondas.map((ronda, ri) => {
    const partidos = ronda.partidos.map(p => renderPartidoEliminatoria(torneo, p)).join('');
    return `
      <div class="bracket-round">
        <div class="bracket-round-title">${esc(ronda.nombre)}</div>
        ${partidos}
      </div>
    `;
  }).join('');
  return `<div class="bracket-container">${columnas}</div>`;
}

function renderPartidoEliminatoria(torneo, partido) {
  const nombreA = partido.equipoA ? esc(partido.equipoA.nombre) : 'Por determinar';
  const nombreB = partido.equipoB ? esc(partido.equipoB.nombre) : 'Por determinar';
  const puedeJugarse = !!(partido.equipoA && partido.equipoB);

  let setsHtml = '';
  if (puedeJugarse) {
    const totalSets = torneo.numSets || NUM_SETS_DEFAULT;
    const setsParaGanar = Math.ceil(totalSets / 2);
    let ganadosA = 0, ganadosB = 0;
    for (let s = 0; s < totalSets; s++) {
      if (ganadosA >= setsParaGanar || ganadosB >= setsParaGanar) break;
      const set = partido.sets[s] || { puntosA: null, puntosB: null };
      const idA = `pe-${partido.id}-${s}-a`;
      const idB = `pe-${partido.id}-${s}-b`;
      setsHtml += `
        <div class="bracket-set-row">
          <span>Set ${s + 1}</span>
          <input type="text" inputmode="numeric" pattern="[0-9]*" class="score-input" id="${idA}" value="${set.puntosA != null ? set.puntosA : ''}" onchange="setResultadoSetEliminatoria('${torneo.id}','${partido.id}',${s}, this.value, document.getElementById('${idB}').value)" />
          <input type="text" inputmode="numeric" pattern="[0-9]*" class="score-input" id="${idB}" value="${set.puntosB != null ? set.puntosB : ''}" onchange="setResultadoSetEliminatoria('${torneo.id}','${partido.id}',${s}, document.getElementById('${idA}').value, this.value)" />
        </div>
      `;
      if (set.puntosA != null && set.puntosB != null) {
        if (set.puntosA > set.puntosB) ganadosA++; else if (set.puntosB > set.puntosA) ganadosB++;
      } else {
        break; // no mostrar el siguiente set hasta rellenar este
      }
    }
  }

  const esGanadorA = partido.ganadorId && partido.equipoA && partido.ganadorId === partido.equipoA.id;
  const esGanadorB = partido.ganadorId && partido.equipoB && partido.ganadorId === partido.equipoB.id;

  return `
    <div class="bracket-match">
      <div class="bracket-team ${esGanadorA ? 'winner' : ''}">${nombreA}</div>
      <div class="bracket-team ${esGanadorB ? 'winner' : ''}">${nombreB}</div>
      ${setsHtml}
    </div>
  `;
}

/* ---------- Render principal ---------- */

function render() {
  const app = document.getElementById('app');
  if (loading) {
    app.innerHTML = '<div class="loading-screen">Cargando…</div>';
    return;
  }

  let body = '';
  if (view.screen === 'calendar') {
    body = `
      <div class="header">
        <div class="header-inner">
          <div class="eyebrow">Volea Beach Forever 🏝️</div>
          <div class="title-row">
            <h1 class="title">Calendario</h1>
          </div>
        </div>
      </div>
      ${renderCalendar()}
      ${renderTorneosSection()}
    `;
  } else if (view.screen === 'list') {
    body = renderListView();
  } else if (view.screen === 'torneo') {
    body = renderTorneoView();
  }

  app.innerHTML = body + renderNewListModal() + renderNewRedModal() + renderNewTorneoModal() + renderEditarTorneoModal() + renderNotifyModal();
}

function renderNotifyModal() {
  if (!notifyMessage) return '';
  return `
    <div class="modal-overlay" onclick="if(event.target===this) closeNotify()">
      <div class="modal-box">
        <h3 class="modal-title">📣 Avisar al grupo</h3>
        <p style="font-size:14px; line-height:1.5; margin:0 0 18px; background:var(--sand); padding:12px 14px; border-radius:10px;">${esc(notifyMessage)}</p>
        <div class="modal-actions">
          <button class="modal-btn cancel" onclick="closeNotify()">No avisar</button>
          <button class="modal-btn confirm" onclick="copyAndOpenWhatsapp()">Copiar y abrir WhatsApp</button>
        </div>
      </div>
    </div>
  `;
}

function sanitizeLista(l) {
  const lugar = (l && typeof l.lugar === 'string') ? l.lugar : '';
  const redesRaw = (l && Array.isArray(l.redes)) ? l.redes : [];

  // Migración: recoger esperas antiguas por red y subirlas al nivel de lista
  const esperaHeredada = redesRaw.flatMap(r => Array.isArray(r.espera) ? r.espera : []);
  const esperaPropia = Array.isArray(l && l.espera) ? l.espera : [];
  const espera = [...esperaPropia, ...esperaHeredada].sort((a, b) => (a.ts || 0) - (b.ts || 0));

  const redes = redesRaw.map((r, i) => ({
    id: r.id || uid(),
    numero: r.numero || (i + 1),
    materiales: {
      balon: (r.materiales && r.materiales.balon) || '',
      red: (r.materiales && r.materiales.red) || '',
      lineas: (r.materiales && r.materiales.lineas) || ''
    },
    jugadores: Array.isArray(r.jugadores) ? r.jugadores : [],
    creatorOwner: r.creatorOwner || null
  }));
  const historial = Array.isArray(l && l.historial) ? l.historial : [];
  return { lugar, espera, redes, historial };
}

function sanitizeEquipo(e) {
  return { id: (e && e.id) || uid(), nombre: (e && typeof e.nombre === 'string') ? e.nombre : '' };
}

function sanitizeGrupo(g) {
  return {
    id: (g && g.id) || uid(),
    nombre: (g && typeof g.nombre === 'string') ? g.nombre : '',
    equipos: (g && Array.isArray(g.equipos)) ? g.equipos.map(sanitizeEquipo) : []
  };
}

function sanitizePuntos(v) {
  return (typeof v === 'number' && !isNaN(v)) ? v : null;
}

function sanitizePartidoGrupo(p) {
  return {
    id: (p && p.id) || uid(),
    grupoId: (p && p.grupoId) || null,
    ronda: (p && typeof p.ronda === 'number') ? p.ronda : 0,
    equipoA: sanitizeEquipo(p && p.equipoA),
    equipoB: sanitizeEquipo(p && p.equipoB),
    puntosA: sanitizePuntos(p && p.puntosA),
    puntosB: sanitizePuntos(p && p.puntosB),
    campo: (p && typeof p.campo === 'number') ? p.campo : null,
    horaInicio: (p && typeof p.horaInicio === 'string') ? p.horaInicio : null,
    arbitro: (p && p.arbitro) ? sanitizeEquipo(p.arbitro) : null
  };
}

function sanitizeSet(s) {
  return { puntosA: sanitizePuntos(s && s.puntosA), puntosB: sanitizePuntos(s && s.puntosB) };
}

function sanitizePartidoEliminatoria(p, i, numSets) {
  const setsRaw = (p && Array.isArray(p.sets)) ? p.sets : [];
  const sets = Array.from({ length: numSets }, (_, idx) => sanitizeSet(setsRaw[idx]));
  return {
    id: (p && p.id) || uid(),
    slotIndex: (p && typeof p.slotIndex === 'number') ? p.slotIndex : i,
    equipoA: (p && p.equipoA) ? sanitizeEquipo(p.equipoA) : null,
    equipoB: (p && p.equipoB) ? sanitizeEquipo(p.equipoB) : null,
    sets,
    ganadorId: (p && p.ganadorId) || null
  };
}

function sanitizeEliminatoria(e, numSets) {
  if (!e || !Array.isArray(e.rondas)) return null;
  const rondas = e.rondas.map(r => ({
    nombre: (r && typeof r.nombre === 'string') ? r.nombre : '',
    partidos: (r && Array.isArray(r.partidos)) ? r.partidos.map((p, i) => sanitizePartidoEliminatoria(p, i, numSets)) : []
  }));
  return { rondas };
}

function sanitizeTorneo(t) {
  const equipos = (t && Array.isArray(t.equipos)) ? t.equipos.map(sanitizeEquipo) : [];
  const numSets = (t && typeof t.numSets === 'number') ? t.numSets : NUM_SETS_DEFAULT;
  return {
    id: (t && t.id) || uid(),
    nombre: (t && typeof t.nombre === 'string') ? t.nombre : '',
    categoria: (t && CATEGORIAS_TORNEO.includes(t.categoria)) ? t.categoria : 'mixto',
    fechaInicio: (t && typeof t.fechaInicio === 'string') ? t.fechaInicio : '',
    fechaFin: (t && typeof t.fechaFin === 'string') ? t.fechaFin : '',
    puntosPorSet: (t && typeof t.puntosPorSet === 'number') ? t.puntosPorSet : PUNTOS_POR_SET_DEFAULT,
    puntosMaximo: (t && typeof t.puntosMaximo === 'number') ? t.puntosMaximo : PUNTOS_MAXIMO_DEFAULT,
    numSets,
    numCampos: (t && typeof t.numCampos === 'number') ? t.numCampos : NUM_CAMPOS_DEFAULT,
    duracionPartidoMin: (t && typeof t.duracionPartidoMin === 'number') ? t.duracionPartidoMin : DURACION_PARTIDO_DEFAULT,
    comidaInicio: (t && typeof t.comidaInicio === 'string') ? t.comidaInicio : null,
    comidaFin: (t && typeof t.comidaFin === 'string') ? t.comidaFin : null,
    equipos,
    numGrupos: (t && typeof t.numGrupos === 'number') ? t.numGrupos : 1,
    numPartidosGrupo: (t && typeof t.numPartidosGrupo === 'number') ? t.numPartidosGrupo : 0,
    clasificadosPorGrupo: (t && typeof t.clasificadosPorGrupo === 'number') ? t.clasificadosPorGrupo : 2,
    bloqueId: (t && typeof t.bloqueId === 'string') ? t.bloqueId : null,
    ordenBloque: (t && typeof t.ordenBloque === 'number') ? t.ordenBloque : 0,
    grupos: (t && Array.isArray(t.grupos)) ? t.grupos.map(sanitizeGrupo) : null,
    sorteoConfirmado: !!(t && t.sorteoConfirmado),
    partidosGrupo: (t && Array.isArray(t.partidosGrupo)) ? t.partidosGrupo.map(sanitizePartidoGrupo) : [],
    eliminatoria: sanitizeEliminatoria(t && t.eliminatoria, numSets),
    creatorOwner: (t && t.creatorOwner) || null,
    historial: (t && Array.isArray(t.historial)) ? t.historial : []
  };
}

function sanitizeState(s) {
  if (!s || typeof s !== 'object') {
    return emptyState();
  }
  const listas = {};
  if (s.listas && typeof s.listas === 'object') {
    Object.keys(s.listas).forEach(fecha => {
      listas[fecha] = sanitizeLista(s.listas[fecha]);
    });
  }
  const torneos = {};
  if (s.torneos && typeof s.torneos === 'object') {
    Object.keys(s.torneos).forEach(id => {
      torneos[id] = sanitizeTorneo(s.torneos[id]);
    });
  }
  return { listas, torneos };
}

function getFechaFromUrl() {
  try {
    const params = new URLSearchParams(window.location.search);
    const fecha = params.get('fecha');
    if (fecha && /^\d{4}-\d{2}-\d{2}$/.test(fecha)) return fecha;
  } catch (e) {
    // ignorar
  }
  return null;
}

function init() {
  loading = true;
  const today = new Date();
  view = { screen: 'calendar', calYear: today.getFullYear(), calMonth: today.getMonth() };
  render();

  DOC_REF.onSnapshot(
    (snap) => {
      if (saving) return;
      let remote = emptyState();
      if (snap.exists) {
        const data = snap.data();
        try {
          remote = sanitizeState(JSON.parse(data.data));
        } catch (e) {
          console.error('Error parseando datos de Firestore', e);
          remote = emptyState();
        }
      }

      const activeFocus = document.activeElement;
      const isTyping = activeFocus && activeFocus.tagName === 'INPUT';

      if (loading) {
        state = remote;
        loading = false;
        const fechaUrl = getFechaFromUrl();
        if (fechaUrl && state.listas[fechaUrl]) {
          view = { screen: 'list', fecha: fechaUrl };
        }
        render();
        return;
      }

      if (isTyping) return;
      if (JSON.stringify(state) === JSON.stringify(remote)) return;
      state = remote;
      render();
    },
    (err) => {
      console.error('Error escuchando Firestore', err);
      if (loading) {
        state = emptyState();
        loading = false;
        render();
      }
    }
  );
}

init();
</script>
