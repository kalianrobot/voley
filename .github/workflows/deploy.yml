# Publica la web en Firebase Hosting (proyecto volea-beach-forever) cada vez
# que llega un cambio a main. También se puede lanzar a mano desde la pestaña
# Actions ("Run workflow").
#
# Necesita el secreto FIREBASE_SERVICE_ACCOUNT con el JSON de una cuenta de
# servicio con permiso de Firebase Hosting Admin. Las reglas de Firestore
# (firestore.rules) no se publican aquí: siguen siendo a mano con
# `firebase deploy --only firestore:rules`.
name: Deploy a Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hosting
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: volea-beach-forever
          channelId: live
